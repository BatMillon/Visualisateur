<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exercices d'échecs</title>
<style>
:root{--light:#eef1fa;--dark:#7d97c8;--w:min(94vw,520px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f4f5f9;color:#1d2433}
header{background:#27345a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:1.25rem}header a{color:#cdd6f4;font-size:.9rem;text-decoration:none}
#tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#fff;border-bottom:1px solid #d9dde8;position:sticky;top:0;z-index:20}
#tabs button{border:1px solid #b9c2dc;background:#f4f6fc;border-radius:18px;padding:7px 14px;font-size:.95rem;cursor:pointer}
#tabs button.on{background:#27345a;color:#fff;border-color:#27345a}
#tabs button.les{border-style:dashed}
#tabs button.ok::after{content:" ✓";color:#2e9d4f;font-weight:700}
#tabs button.on.ok::after{color:#8ff0aa}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:10px;padding:12px 14px;line-height:1.5;margin-bottom:12px;border:1px solid #e1e5f0;white-space:pre-line}
#board{width:var(--w);aspect-ratio:1;margin:8px auto;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:3px solid #27345a;border-radius:4px;touch-action:none;user-select:none;position:relative}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,214,0,.45)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(80,200,120,.5)}
.sq.bad{box-shadow:inset 0 0 0 100px rgba(235,60,60,.55)}
.sq.tgt::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(30,60,30,.35);position:absolute}
.sq.tgt.occ::after{width:90%;height:90%;background:none;border:4px solid rgba(30,60,30,.35)}
#board .pc{position:absolute;inset:0;background-size:88%;background-position:center;background-repeat:no-repeat;pointer-events:none;z-index:2}
#ghost{background-size:contain;background-repeat:no-repeat;width:calc(var(--w)/8);height:calc(var(--w)/8);position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%);display:none}
.co{position:absolute;font-size:10px;opacity:.55;pointer-events:none;font-weight:600}
.co.r{left:3px;top:2px}.co.f{right:3px;bottom:1px}
#panel{text-align:center;min-height:90px}
#msg{font-size:1.1rem;margin:10px 0;min-height:1.5em}
#msg.good{color:#1f8a43;font-weight:600}#msg.bad{color:#c0392b;font-weight:600}
#txt{text-align:left}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns button{border:0;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer;background:#27345a;color:#fff}
.btns button.alt{background:#fff;color:#27345a;border:1px solid #27345a}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
footer{text-align:center;font-size:.75rem;color:#7a8299;padding:16px}
</style></head><body>
<header><h1 id="title"></h1><a href="index.html" id="home" hidden>← Tous les cours</a></header>
<div id="tabs"></div>
<main>
<div id="intro" class="card" hidden></div>
<div id="board"></div><div id="ghost"></div>
<div id="panel"><div id="msg"></div><div id="txt" class="card" hidden></div><div class="btns" id="btns"></div></div>
</main>
<footer>Page générée automatiquement à partir du cours</footer>

    b.onclick=()=>open(it.id);t.appendChild(b)})}
function open(id){clear();QM=null;ARR=[];cur=id;sel=null;last=[];bad=[];kb=null;mode='idle';setTxt('');setBtns([]);setMsg('');tabs();
  const it=ITEMS.find(x=>x.id===id);const intro=$('intro');
  intro.textContent=it.text||'';intro.hidden=!it.text;
  if(it.kind==='situation')situation(it);else if(it.kind==='lesson')lesson(it);else exercise(it)}

/* ---------- Situation animée (PDF) ---------- */
function situation(S){
  const loop=()=>{clear();ARR=(S.arrows||[]).slice();game=new Chess(S.fen);orient=game.turn();last=[];mode='idle';render();
    if(!S.moves.length){setMsg('');setBtns([]);return}
    setMsg('Observe la position…');setBtns([]);
    let i=0;const step=()=>{if(i>=S.moves.length){setMsg('Coup clé : '+frLine(S.fen,S.moves),'good');setBtns([['↺ Rejouer',loop,0]]);return}
      ARR=ARR.filter(a=>a.color!=='green');const m=game.move(S.moves[i++]);last=[m.from,m.to];render(animOf(m));later(step,2800)};later(step,2000)};
  loop()}

/* ---------- Leçon : partie commentée, coup par coup ---------- */
function lesson(L){
  const S=L.steps;let k=0,auto=false;orient=new Chess(S[0].fen).turn();
  const lab=n=>{const f=S[n-1].fen.split(' '),num=f[5],w=f[1]==='w';return (w?num+'. ':num+'… ')+fr(S[n].san)};
  const ctrl=()=>setBtns([['⏮',()=>go(0),1],['◀ Précédent',()=>go(k-1),1],['Suivant ▶',()=>go(k+1),0],['⏭',()=>go(S.length-1),1],[auto?'⏸ Pause':'▶ Lecture auto',toggle,1]]
    .concat(S.length>1?[['🎯 Mode quiz',()=>{clear();auto=false;kb=null;quiz(L,()=>lesson(L))},0]]:[]).concat(S[k].alts.map(a=>['💡 Autre idée : '+fr(a.line[0]),()=>alt(a),1])));
  const tick=()=>{if(!auto)return;later(()=>{if(k<S.length-1){go(k+1,true);tick()}else{auto=false;ctrl()}},3400)};
  const toggle=()=>{auto=!auto;if(!auto){clear();ctrl();return}if(k===S.length-1)go(0,true);ctrl();tick()};
  const go=(n,fromAuto)=>{if(n<0||n>=S.length)return;if(!fromAuto){auto=false;clear()}
    const fw=n===k+1;k=n;game=new Chess(S[k].fen);last=[];let anim=null;
    if(k>0){const m=new Chess(S[k-1].fen).move(S[k].san);last=[m.from,m.to];if(fw)anim=animOf(m)}
    ARR=S[k].arrows||[];render(anim);
    setMsg(k===0?'Position de départ ('+k+'/'+(S.length-1)+')':'Coup '+lab(k)+'  ('+k+'/'+(S.length-1)+')');setTxt(S[k].comment);ctrl()};
  const alt=a=>{clear();auto=false;game=new Chess(S[k].fen);ARR=[];last=[];render();setTxt(a.comment);
    setMsg('Autre idée : '+frLine(S[k].fen,a.line));setBtns([['↩ Retour à la partie',()=>go(k),0]]);
    let i=0;const step=()=>{if(i>=a.line.length)return;const m=game.move(a.line[i++]);last=[m.from,m.to];render(animOf(m));later(step,1500)};later(step,900)};
  kb=e=>{if(e.key==='ArrowRight')go(k+1);else if(e.key==='ArrowLeft')go(k-1)};
  go(0)}


/* ---------- Mode quiz : deviner les coups de la leçon ---------- */
function quiz(L,back){
  const S=L.steps,hero=new Chess(S[0].fen).turn();orient=hero;
  const isHero=n=>new Chess(S[n-1].fen).turn()===hero;
  const hasKey=S.some((s,n)=>n>0&&isHero(n)&&s.key);          // coups marqués « ! » par le prof
  const isQ=n=>n>0&&isHero(n)&&(!hasKey||S[n].key);
  const total=S.filter((s,n)=>isQ(n)).length;
  let k=0,score=0,qn=0,tries=0,cur_=null;
  const lab=n=>{const f=S[n-1].fen.split(' ');return (f[1]==='w'?f[5]+'. ':f[5]+'… ')+fr(S[n].san)};
  const camp=hero==='w'?'blancs':'noirs';
  const apply=(n,anim)=>{game=new Chess(S[k].fen);const m=game.move(S[n].san);last=[m.from,m.to];k=n;ARR=S[n].arrows||[];render(anim?animOf(m):null);return m};
  const next=()=>{
    if(k>=S.length-1)return end();
    const n=k+1;
    if(isQ(n))return ask(n,false);
    apply(n,true);mode='idle';setMsg('Coup '+lab(n));setTxt(S[n].comment);setBtns([]);later(next,2800)};
  const ask=(n,retry)=>{mode='quiz';game=new Chess(S[k].fen);last=[];bad=[];sel=null;ARR=(S[k].arrows||[]).slice();cur_=n;if(!retry){qn++;tries=0}
    render();setTxt('');setMsg('🎯 Question '+qn+'/'+total+' : trouve le meilleur coup pour les '+camp+' !');
    setBtns([['💡 Indice',()=>{const m=new Chess(S[k].fen).move(S[n].san);ARR=(S[k].arrows||[]).concat([{from:m.from,to:m.from,color:'yellow'}]);render()},1],['⏹ Arrêter le quiz',back,1]])};
  const cont=()=>{setBtns([['Suite →',next,0]])};
  QM=(from,to,animate)=>{
    const n=cur_,legal=game.moves({verbose:true}).filter(x=>x.from===from&&x.to===to);if(!legal.length){sel=null;render();return}
    const accepted=[{san:S[n].san,main:true,comment:S[n].comment}].concat(S[k].alts.map(a=>({san:a.line[0],main:false,comment:a.comment})));
    const fit=accepted.map(a=>({a,m:new Chess(S[k].fen).move(a.san)})).find(x=>x.m&&x.m.from===from&&x.m.to===to);
    const promo=legal.length>1?((fit&&fit.m.promotion)||'q'):undefined;
    const mv=game.move({from,to,promotion:promo});sel=null;last=[from,to];
    if(fit){mode='wait';if(tries===0)score++;render(animate&&animOf(mv));
      if(fit.a.main){k=n;ARR=S[n].arrows||[];render();setMsg('✔ Bravo ! '+lab(n),'good');setTxt(S[n].comment);cont()}
      else{ARR=[];render();setMsg('✔ Bonne idée aussi ! ('+fr(fit.a.san)+')','good');setTxt((fit.a.comment?fit.a.comment+'\n\n':'')+'Dans la partie, le prof joue : '+lab(n)+(S[n].comment?' — '+S[n].comment:''));
        setBtns([['Suite →',()=>{apply(n,true);next0()},0]])}}
    else{mode='quizfail';tries++;bad=[from,to];render();$('board').classList.remove('shake');void $('board').offsetWidth;$('board').classList.add('shake');
      setMsg('✘ Pas tout à fait…','bad');
      setBtns([['↺ Réessayer',()=>ask(n,true),0],['👁 Voir la réponse',()=>{game=new Chess(S[k].fen);bad=[];last=[];render();apply(n,true);setMsg('Réponse : '+lab(n),'good');setTxt(S[n].comment);cont()},1]])}};
  const next0=()=>{mode='idle';setMsg('Coup '+lab(k));setTxt(S[k].comment);setBtns([['Suite →',next,0]])};
  const end=()=>{mode='idle';QM=null;setMsg(total?'🏁 Quiz terminé : '+score+'/'+total+' du premier coup':'Cette leçon n’a pas de coup à deviner.',total&&score===total?'good':'');setTxt('');
    setBtns([['↺ Rejouer le quiz',()=>{clear();quiz(L,back)},0],['← Retour à la leçon',back,1]])};
  game=new Chess(S[0].fen);ARR=S[0].arrows||[];last=[];bad=[];render();setTxt(S[0].comment);
  setMsg('Quiz : '+total+' question'+(total>1?'s':'')+(hasKey?' (coups clés du prof)':''));setBtns([['Commencer ▶',next,0],['← Retour à la leçon',back,1]])}

/* ---------- Exercice ---------- */
function exercise(E){
  let cand=[];
  const done=()=>cand.every(c=>c.length<=idx);
  const exp=c=>c.length>idx?new Chess(game.fen()).move(c[idx]):null;
  const start=()=>{clear();game=new Chess(E.fen);orient=game.turn();idx=0;last=[];bad=[];sel=null;ARR=(E.arrows||[]).slice();
    cand=(E.lines||[]).map(l=>l.slice());
    if(!cand.length){mode='free';setMsg(E.note||'Solution non reconnue dans le PDF : position en mode libre.');setBtns([]);render();return}
    mode='play';render();setMsg('À toi de jouer : les '+(orient==='w'?'blancs':'noirs')+' jouent et trouvent le meilleur coup !');setBtns([])};
  const correction=()=>{clear();game=new Chess(E.fen);last=[];bad=[];sel=null;mode='anim';ARR=(E.arrows||[]).slice();render();setBtns([]);
    const L=E.lines[0];let i=0;const step=()=>{if(i>=L.length){ARR=(E.arrows||[]).concat(E.endArrows||[]);render();setMsg('Correction : '+frLine(E.fen,L),'good');
        setBtns([['↺ Recommencer',start,0],['▶ Revoir',correction,1]]);mode='idle';return}
      const m=game.move(L[i++]);last=[m.from,m.to];render(animOf(m));
      setMsg('Correction : '+frLine(E.fen,L.slice(0,i)),'');later(step,2400)};later(step,1200)};
  E._start=start;E._corr=correction;E._done=done;E._get=()=>cand;E._set=c=>{cand=c};start()}

function tryMove(from,to,animate){
  if(mode==='quiz'&&QM)return QM(from,to,animate);
  const E=ITEMS.find(e=>e.id===cur);
  if(mode==='free'){const m=game.moves({verbose:true}).find(x=>x.from===from&&x.to===to);
    if(m){const r=game.move({from,to,promotion:'q'});last=[from,to];sel=null;render(animate&&animOf(r))}return}
  if(mode!=='play')return;
  const legal=game.moves({verbose:true}).filter(x=>x.from===from&&x.to===to);if(!legal.length){sel=null;render();return}
  let cand=E._get();
  const fits=cand.filter(c=>{const m=c.length>idx?new Chess(game.fen()).move(c[idx]):null;return m&&m.from===from&&m.to===to});
  const em=fits.length?new Chess(game.fen()).move(fits[0][idx]):null;
  const promo=legal.length>1?((em&&em.promotion)||'q'):undefined;
  const mv=game.move({from,to,promotion:promo});sel=null;last=[from,to];
  render(animate&&animOf(mv));
  if(fits.length){cand=fits;idx++;E._set(cand);
    if(E._done())return win(E);
    setMsg('✔ Bien joué !','good');mode='wait';
    later(()=>{const c=cand.find(x=>x.length>idx);const r=game.move(c[idx]);idx++;last=[r.from,r.to];render(animOf(r));
      cand=cand.filter(x=>x.length>=idx&&x[idx-1]===c[idx-1]);E._set(cand);
      if(E._done())return win(E);mode='play';setMsg('À toi !','')},900)}
  else{mode='fail';bad=[from,to];render();$('board').classList.remove('shake');void $('board').offsetWidth;$('board').classList.add('shake');
    setMsg('✘ Ce n’est pas le bon coup.','bad');setBtns([['↺ Recommencer',E._start,0],['👁 Voir la correction',E._corr,1]])}
}
function win(E){mode='idle';store[E.id]=1;save();tabs();ARR=(E.arrows||[]).concat(E.endArrows||[]);render();
  const others=E.lines.slice(1);
  setMsg('🎉 Bravo, exercice réussi : '+frLine(E.fen,E.lines[0]),'good');
  setTxt(others.length?'Autres solutions acceptées : '+others.map(l=>frLine(E.fen,l)).join(' ; '):'');
  const i=ITEMS.indexOf(E),nx=ITEMS.slice(i+1).find(x=>x.kind==='exercise');
  setBtns([['↺ Rejouer',E._start,1]].concat(nx?[['Exercice suivant →',()=>open(nx.id),0]]:[]))}

/* ---------- Saisie : clic-clic et glisser-déposer ---------- */
const bd=$('board'),gh=$('ghost');
const sqOf=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);const s=t&&t.closest&&t.closest('.sq');return s&&s.dataset.sq};
bd.addEventListener('pointerdown',e=>{
  if(mode!=='play'&&mode!=='free'&&mode!=='quiz')return;const s=e.target.closest('.sq');if(!s)return;const name=s.dataset.sq;
  const p=game.get(name);
  if(sel&&sel!==name&&game.moves({square:sel,verbose:true}).some(m=>m.to===name)){tryMove(sel,name,true);return}
  if(p&&p.color===game.turn()){sel=name;render();
    const sp=bd.querySelector('[data-sq="'+name+'"] .pc');
    drag={from:name,x:e.clientX,y:e.clientY,on:false,bg:sp?sp.style.backgroundImage:''};
    bd.setPointerCapture(e.pointerId)}
  else{sel=null;render()}});
bd.addEventListener('pointermove',e=>{if(!drag)return;
  if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){drag.on=true;gh.style.backgroundImage=drag.bg;gh.style.display='block';
    const sp=bd.querySelector('[data-sq="'+drag.from+'"] .pc');if(sp)sp.style.opacity=.25}
  if(drag.on){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px'}});
bd.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;gh.style.display='none';
  if(d.on){const to=sqOf(e);if(to&&to!==d.from)tryMove(d.from,to,false);else render()}});
bd.addEventListener('pointercancel',()=>{drag=null;gh.style.display='none';render()});
document.addEventListener('keydown',e=>{if(kb)kb(e)});

$('title').textContent=D.title;document.title=D.title;
if(location.protocol.startsWith('http'))$('home').hidden=false;
open(ITEMS[0].id);
</script></body></html>
